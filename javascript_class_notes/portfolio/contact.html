<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Alice Chen for web development projects, collaborations, and opportunities.">
  <title>Contact | Alice Chen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <!-- Header & Navigation -->
  <header class="site-header">
    <div class="container header-container">
      <h1 id="page-title" class="logo">Alice Chen</h1>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
      <nav class="site-nav" aria-label="Main Navigation">
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="contact-section">
      <div class="container contact-container">
        <div class="section-header">
          <h2 class="section-title">Get in Touch</h2>
          <p class="section-subtitle">Have a question or want to work together? Send me a message below.</p>
        </div>

        <div class="form-wrapper">
          <!-- Form will be wired to validation in Week 2 Module 4 & Week 4 -->
          <form id="contact-form" class="contact-form" novalidate>
            <!-- Name Field -->
            <div class="form-group">
              <label for="visitor-name" class="form-label">Full Name</label>
              <input 
                type="text" 
                id="visitor-name" 
                name="name" 
                class="form-input" 
                placeholder="e.g. Jane Doe" 
                required
              >
            </div>

            <!-- Email Field -->
            <div class="form-group">
              <label for="visitor-email" class="form-label">Email Address</label>
              <input 
                type="email" 
                id="visitor-email" 
                name="email" 
                class="form-input" 
                placeholder="e.g. jane@example.com" 
                required
              >
            </div>

            <!-- Preferred Contact Method -->
            <fieldset class="form-fieldset">
              <legend class="form-legend">Preferred Contact Method</legend>
              <div class="radio-group">
                <label class="radio-label">
                  <input type="radio" name="contact-method" value="email" checked>
                  <span>Email</span>
                </label>
                <label class="radio-label">
                  <input type="radio" name="contact-method" value="phone">
                  <span>Phone</span>
                </label>
              </div>
            </fieldset>

            <!-- Message Field (with real minlength="20" from course outline) -->
            <div class="form-group">
              <label for="message" class="form-label">Message (min. 20 characters)</label>
              <textarea 
                id="message" 
                name="message" 
                class="form-textarea" 
                rows="5" 
                minlength="20" 
                placeholder="Write your message here..." 
                required
              ></textarea>
            </div>

            <!-- Error message feedback element (ready for Week 2/4 validation) -->
            <p id="error-message" class="form-feedback error-message" role="alert" aria-live="polite"></p>

            <button type="submit" id="submit-btn" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p class="copyright">&copy; 2026 Alice Chen. All rights reserved.</p>
      <ul class="footer-links">
        <li><a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
