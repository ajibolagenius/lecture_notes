                - generic [ref=f12e195]:
                  - generic [ref=f12e196]: •
                  - generic [ref=f12e198]: You might expose internal errors that reveal security vulnerabilities.
                - generic [ref=f12e204]:
                  - generic [ref=f12e205]: •
                  - generic [ref=f12e207]: Without clear error messages, users won’t know what went wrong.
