                - heading "What Are Database Migrations?" [level=2] [ref=f6e142]
                - generic [ref=f6e143]: Database migrations are changes to a database schema that are version controlled and applied in a structured manner. They allow developers to change the database structure over time while maintaining consistency across different environments (development, testing, and production).
                - generic [ref=f6e149]: Typically, companies use migration tools like Knex.js, Sequelize, TypeORM, or Prisma to automate this process. These tools generate migration files and handle applying (migrating up) and rolling back (migrating down) changes to the database. However, in this lesson, we’ll manually create and run migration scripts to simulate what these tools do under the hood.
