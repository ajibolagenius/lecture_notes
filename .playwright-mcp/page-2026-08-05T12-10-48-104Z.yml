              - generic [ref=f4e143]:
                - generic [ref=f4e144]: To store and manage reminders, we need a database. For this project, we will use Neon, a serverless PostgreSQL database that is easy to set up, scalable, and well-suited for modern web applications.
                - heading "Understanding Different Types of Databases" [level=2] [ref=f4e154]
                - generic [ref=f4e155]: "Before jumping into the setup, let’s briefly go over the three main types of databases you might encounter:"
                - table [ref=f4e171]:
                  - rowgroup [ref=f4e172]:
                    - row [disabled] [ref=f4e173]:
                      - cell "Database Type" [ref=f4e174]
                      - cell "Description" [ref=f4e177]
                      - cell "Pros" [ref=f4e180]
                      - cell "Cons" [ref=f4e183]
                    - row [disabled] [ref=f4e186]:
                      - cell "Self-Hosted Database" [ref=f4e187]
                      - cell "You install, configure, and maintain the database on your own." [ref=f4e190]
                      - cell "- Full control over configuration - Can be optimized for specific workloads" [ref=f4e193]
                      - cell "- Requires extensive expertise in DB management - Manual backups & scaling - Higher maintenance overhead" [ref=f4e196]
                    - row [disabled] [ref=f4e199]:
                      - cell "Managed Database (AWS RDS)" [ref=f4e200]
                      - cell "A cloud provider manages the database, including backups, scaling, and maintenance." [ref=f4e203]
                      - cell "- Automated backups & failover - Less maintenance work - Well suited for high-traffic apps with proper scaling" [ref=f4e206]
                      - cell "- Can be expensive when not optimized properly - Requires fine tuning for cost & performance" [ref=f4e209]
                    - row [disabled] [ref=f4e212]:
                      - cell "Serverless Database (Neon)" [ref=f4e213]
                      - cell "Fully cloud-managed, auto-scales based on demand and you only pay for what you use." [ref=f4e216]
                      - cell "- No need to manage servers - Cost efficient for unpredictable workloads - Easy to deploy and start using" [ref=f4e219]
                      - cell "- Less control over tuning and optimizations - Potentially more expensive for consistently high-traffic applications" [ref=f4e222]
                - heading "Why Serverless?" [level=4] [ref=f4e229]
                - generic [ref=f4e230]: "For us, serverless PostgreSQL is the best choice because:"
                - generic [ref=f4e239]:
                  - generic [ref=f4e240]: •
                  - generic [ref=f4e242]: It is easy to set up and start using.
                - generic [ref=f4e248]:
                  - generic [ref=f4e249]: •
                  - generic [ref=f4e251]: It eliminates unnecessary maintenance tasks.
                - generic [ref=f4e257]:
                  - generic [ref=f4e258]: •
                  - generic [ref=f4e260]: It scales automatically without manual intervention.
                - generic [ref=f4e266]:
                  - generic [ref=f4e267]: •
                  - generic [ref=f4e269]: It has a generous free tier.
                - note [ref=f4e279]:
                  - generic [ref=f4e280]:
                    - img "Callout icon" [ref=f4e286]: 💡
                    - generic [ref=f4e287]: However, if you're running a consistently high-traffic application or need deep performance optimizations, a managed database like AWS RDS might be a better fit - but only if you optimize it correctly.
                - separator [disabled] [ref=f4e296]
                - heading "Setting Up a Neon Database" [level=2] [ref=f4e301]
                - generic [ref=f4e302]: "Follow the steps below to create and configure your database:"
                - generic [ref=f4e311]:
                  - generic [ref=f4e312]: "1."
                  - generic [ref=f4e316]:
                    - text: Go to
                    - link "Neon’s official website" [disabled] [ref=f4e317] [cursor=pointer]:
                      - /url: https://neon.tech/
                    - text: and create a new account.
                - generic [ref=f4e321]:
                  - generic [ref=f4e322]: "2."
                  - generic [ref=f4e324]: Once logged in, click New Project.
                - generic [ref=f4e330]:
                  - generic [ref=f4e331]: "3."
                  - generic [ref=f4e333]: Provide a name for your database.
                - generic [ref=f4e339]:
                  - generic [ref=f4e340]: "4."
                  - generic [ref=f4e342]: Select a region that is closest to your target users (this improves performance).
                - generic [ref=f4e348]:
                  - generic [ref=f4e349]: "5."
                  - generic [ref=f4e351]: Click Create and just like that you have a running PostgreSQL database!
                - separator [disabled] [ref=f4e356]
                - heading "Using Raw SQL vs. ORM" [level=2] [ref=f4e361]
                - heading "What is an ORM?" [level=4] [ref=f4e366]
                - generic [ref=f4e367]: At a high level, an ORM is a tool that allows developers to interact with a database using object-oriented code instead of writing raw SQL queries. This makes database operations easier to read and write.
                - generic [ref=f4e373]: "Raw SQL:"
                - figure [ref=f4e381]
                - generic [ref=f4e384]: "Drizzle ORM:"
                - figure [ref=f4e392]
                - note [ref=f4e396]:
                  - generic [ref=f4e397]:
                    - img "Callout icon" [ref=f4e403]: 💡
                    - generic [ref=f4e404]: While ORMs provide additional benefits, we're focusing on the key difference here. It's also worth noting that many ORMs allow developers to write raw SQL queries when needed.
                - heading "ORMs vs. Raw SQL" [level=4] [ref=f4e415]
                - table [ref=f4e426]:
                  - rowgroup [ref=f4e427]:
                    - row [disabled] [ref=f4e428]:
                      - cell "Feature" [ref=f4e429]
                      - cell "ORM" [ref=f4e432]
                      - cell "Raw SQL" [ref=f4e435]
                    - row [disabled] [ref=f4e438]:
                      - cell "Ease of Use" [ref=f4e439]
                      - cell "Easier for simple CRUD operations" [ref=f4e442]
                      - cell "More complex but offers deep control" [ref=f4e445]
                    - row [disabled] [ref=f4e448]:
                      - cell "Performance" [ref=f4e449]
                      - cell "Can be slower for complex queries due to abstraction" [ref=f4e452]
                      - cell "Often faster, but depends on query optimization" [ref=f4e455]
                    - row [disabled] [ref=f4e458]:
                      - cell "Flexibility" [ref=f4e459]
                      - cell "Limited to ORM's capabilities" [ref=f4e462]
                      - cell "Full control over queries and optimizations" [ref=f4e465]
                    - row [disabled] [ref=f4e468]:
                      - cell "Learning Curve" [ref=f4e469]
                      - cell "Easier for beginners with no or minimal SQL knowledge" [ref=f4e472]
                      - cell "Requires deeper understanding of SQL" [ref=f4e475]
                - generic [ref=f4e478]: Why Are We Using Raw SQL?
                - generic [ref=f4e484]: Since this is a learning project, understanding SQL is more valuable than simply relying on an ORM. By working directly with raw SQL, you'll gain a strong foundation in database interactions, which will help you in the long run.
                - note [ref=f4e491]:
                  - generic [ref=f4e492]:
                    - img "Callout icon" [ref=f4e498]: 💡
                    - generic [ref=f4e499]: It’s not uncommon for companies to use a mix of both - ORMs for simple operations and raw SQL for performance critical queries.
