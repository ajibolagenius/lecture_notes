              - generic [ref=f10e159]:
                - generic [ref=f10e160]: In this lesson, we’ll learn how big companies structure their projects for scalability and maintainability using the MVC (Model-View-Controller) pattern along with a Service Layer. This structure helps keep the project organized, making it easier to manage as it grows.
                - generic [ref=f10e166]: We’ll break down the responsibilities of each layer in simple terms.
                - heading "Understanding MVC + Service Layer" [level=2] [ref=f10e176]
                - generic [ref=f10e177]: Below I will try to simplify what each layer is responsible for giving an analogy based on restaurant.
                - heading "Controllers – Handle requests and send responses." [level=4] [ref=f10e187]
                - generic [ref=f10e188]: The controller is the one that takes the user’s order (requests), passes it to the kitchen (service layer), and brings back the prepared dish (response). It doesn't process the data or prepare anything, it acts only as the intermediary.
                - heading "Services – Responsible for the logic and the actual processing of the data." [level=4] [ref=f10e198]
                - generic [ref=f10e199]: The kitchen (service layer) takes the order, processes it, prepares the food based on the ingredients (model), possibly combines multiple ingredients (data from model), and adds specific processes like cooking, mixing, or garnishing.
                - heading "Models – Communicate with the database." [level=4] [ref=f10e209]
                - generic [ref=f10e210]: You can think of it like the ingredients used to make the dishes. It doesn’t care about how the food is prepared or served, it simply provides the essential components (data) to the kitchen (service layer) so the dish can be created.
                - separator [disabled] [ref=f10e218]
                - heading "Controller Layer" [level=2] [ref=f10e223]
                - heading "What is a Controller?" [level=3] [ref=f10e228]
                - generic [ref=f10e229]: The controller acts as the intermediary between the client (or user) and the application's core logic (service layer and model). It’s responsible for receiving HTTP requests from the client, processing them (often by interacting with the service layer), and sending back an appropriate HTTP response.
                - generic [ref=f10e235]: "Responsibilities:"
                - generic [ref=f10e244]:
                  - generic [ref=f10e245]: •
                  - generic [ref=f10e247]: Handle incoming HTTP requests (GET, POST, PUT, DELETE, etc.).
                - generic [ref=f10e253]:
                  - generic [ref=f10e254]: •
                  - generic [ref=f10e256]: Call functions from the service layer to process the request.
                - generic [ref=f10e262]:
                  - generic [ref=f10e263]: •
                  - generic [ref=f10e265]: Format the response (e.g., JSON, HTML) and send it back to the client.
                - generic [ref=f10e271]:
                  - generic [ref=f10e272]: •
                  - generic [ref=f10e274]: Handle errors and return appropriate status codes (like 404, 500, etc.).
